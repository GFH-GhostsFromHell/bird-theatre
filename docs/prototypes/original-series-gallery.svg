<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="670" viewBox="0 0 1500 670" role="img" aria-labelledby="title desc">
<title id="title">Bird Theatre Original Series prototype gallery</title>
<desc id="desc">Five technical concept illustrations: original smart birdhouse with straight-out removable observation perch, circular seed feeder, nesting box, owl house, and modular bird observation post. These are proposed prototypes, not manufactured or tested products.</desc>
