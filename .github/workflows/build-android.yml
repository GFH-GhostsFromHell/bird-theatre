name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android-client/**', '.github/workflows/build-android.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload test APK (not production signed)
        uses: actions/upload-artifact@v4
        with:
          name: BirdTheatre-Android-Debug-APK
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
