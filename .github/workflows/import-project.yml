name: Import Bird Theatre project source
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/source.tar.xz'
      - '.github/workflows/import-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'GFH-GhostsFromHell/bird-theatre'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify archive and unpack project
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, tarfile
          archive = Path(".bootstrap/source.tar.xz")
          if not archive.exists():
              print("Source archive already imported.")
              raise SystemExit(0)
          expected = "d8122bf646e805cc3c61137ccfa4cb52d0a6acd6fcb925952dcfc02c74383fde"
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Archive integrity check failed: {actual}")
          paths = []
          with tarfile.open(archive, "r:xz") as tar:
              for member in tar:
                  name = PurePosixPath(member.name)
                  if not member.isfile() or name.is_absolute() or ".." in name.parts or name.parts[0] == ".git":
                      raise SystemExit(f"Invalid archive member: {name}")
                  target = Path(*name.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(tar.extractfile(member).read())
                  paths.append(str(target))
          if len(paths) != 62:
              raise SystemExit(f"Expected 62 files; got {len(paths)}")
          print("Extracted", len(paths), "files")
          PY
      - name: Commit the extracted project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only source files: GitHub Actions tokens cannot create workflow files.
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo "Project already imported."
          else
            git commit -m 'Import Bird Theatre multi-platform source, AI agents and build workflows'
            git push origin HEAD:main
          fi
