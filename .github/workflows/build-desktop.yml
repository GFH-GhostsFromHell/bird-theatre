name: Build, test and release Bird Theatre Windows MSI

on:
  push:
    branches: [main]
    paths:
      - 'desktop-client/**'
      - 'scripts/ReleaseSigner.java'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-client
    env:
      UPDATE_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test signed updater logic without network
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/update-tests | Out-Null
          javac -d target/update-tests src/main/java/ca/gfh/birdtheatre/UpdateService.java src/test/java/ca/gfh/birdtheatre/UpdateServiceSelfTest.java
          java -cp target/update-tests ca.gfh.birdtheatre.UpdateServiceSelfTest

      - name: Compile desktop client with JavaFX and collect dependencies
        run: mvn -B clean package

      - name: Set monotonically increasing Windows Installer version
        shell: pwsh
        run: |
          $v = "0.1.${{ github.run_number }}"
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Building Bird Theatre version $v"

      - name: Create self-contained Windows MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/installer | Out-Null
          $options = @(
            '--type', 'msi',
            '--name', 'BirdTheatre',
            '--app-version', $env:APP_VERSION,
            '--vendor', 'GFH',
            '--description', 'Bird Theatre community wildlife monitoring',
            '--input', 'target/jpackage-input',
            '--main-jar', 'bird-theatre-desktop-0.1.0.jar',
            '--main-class', 'ca.gfh.birdtheatre.Launcher',
            '--dest', 'target/installer',
            '--add-modules', 'jdk.crypto.ec,java.net.http,jdk.jsobject,java.desktop',
            '--win-per-user-install',
            '--win-upgrade-uuid', 'a97ee0d9-a576-4ab4-a03e-afc40d4aac13',
            '--win-menu', '--win-shortcut',
            '--java-options', "-Dbirdtheatre.version=$env:APP_VERSION"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PUBLIC_KEY_BASE64)) {
            $options += @('--java-options', "-Dbirdtheatre.updatePublicKey=$env:UPDATE_SIGNING_PUBLIC_KEY_BASE64")
          }
          & jpackage @options
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed' }
          $msi = Get-ChildItem target/installer/*.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI was not created' }
          Copy-Item $msi.FullName target/installer/BirdTheatre-Windows-Setup.msi
          Get-FileHash target/installer/BirdTheatre-Windows-Setup.msi -Algorithm SHA256 | Format-Table

      - name: Verify packaged Windows launcher and bundled JavaFX runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/smoke | Out-Null
          $args = @(
            '--type', 'app-image',
            '--name', 'BirdTheatre',
            '--app-version', $env:APP_VERSION,
            '--input', 'target/jpackage-input',
            '--main-jar', 'bird-theatre-desktop-0.1.0.jar',
            '--main-class', 'ca.gfh.birdtheatre.Launcher',
            '--dest', 'target/smoke',
            '--add-modules', 'jdk.crypto.ec,java.net.http,jdk.jsobject,java.desktop',
            '--java-options', "-Dbirdtheatre.version=$env:APP_VERSION"
          )
          & jpackage @args
          if ($LASTEXITCODE -ne 0) { throw 'Packaged app-image build failed' }
          $exe = 'target/smoke/BirdTheatre/BirdTheatre.exe'
          if (-not (Test-Path $exe)) { throw 'Bundled Windows launcher was not generated' }
          # GUI-subsystem EXEs can return to PowerShell before their JVM has started.
          $resolved = (Resolve-Path $exe).Path
          $process = Start-Process -FilePath $resolved -ArgumentList '--package-self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged JavaFX self-test failed: $($process.ExitCode)" }
          Start-Sleep -Milliseconds 500
          $log = Join-Path $env:LOCALAPPDATA 'BirdTheatre/desktop-startup.log'
          if (-not (Test-Path $log)) { throw 'Packaged launcher failed to create startup diagnostics' }
          if ((Get-Content -LiteralPath $log -Raw) -notmatch 'Packaged runtime self-test passed') {
            throw 'Bundled launcher could not load its JavaFX and HTTP runtime components'
          }

      - name: Upload MSI installer from each successful build
        uses: actions/upload-artifact@v4
        with:
          name: BirdTheatre-Windows-Setup
          path: desktop-client/target/installer/BirdTheatre-Windows-Setup.msi
          retention-days: 30
          if-no-files-found: error

      - name: Check if signed publishing is configured
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PUBLIC_KEY_BASE64) -and
              -not [string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PRIVATE_KEY_BASE64)) {
            'enabled=true' >> $env:GITHUB_OUTPUT
          } else {
            'enabled=false' >> $env:GITHUB_OUTPUT
          }

      - name: Publish verifiable stable update release
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "windows-v$env:APP_VERSION"
          $filename = 'BirdTheatre-Windows-Setup.msi'
          $msi = "target/installer/$filename"
          $sha256 = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$filename"
          $manifest = @{ version = "$env:APP_VERSION"; url = $url; sha256 = $sha256 } | ConvertTo-Json -Compress
          $manifestPath = 'target/installer/BirdTheatre-update.json'
          $signaturePath = "$manifestPath.sig"
          [IO.File]::WriteAllText((Join-Path $PWD $manifestPath), $manifest, [Text.UTF8Encoding]::new($false))
          java ../scripts/ReleaseSigner.java $manifestPath $signaturePath
          if ($LASTEXITCODE -ne 0) { throw 'Release manifest signing failed' }
          gh release create $tag $msi $manifestPath $signaturePath `
            --repo "${{ github.repository }}" `
            --title "Bird Theatre Windows $env:APP_VERSION" `
            --notes "Stable Windows per-user MSI. Updates are verified using signed release metadata and SHA-256, downloaded in the background, and automatically installed when Bird Theatre closes." `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }

      - name: Explain unsigned/nonpublished builds
        if: steps.signing.outputs.enabled == 'false'
        shell: pwsh
        run: |
          Write-Host 'MSI artifact produced, but no automatic-update release published.'
          Write-Host 'Configure repo variable UPDATE_SIGNING_PUBLIC_KEY_BASE64 and secret UPDATE_SIGNING_PRIVATE_KEY_BASE64 as documented.'
          Write-Host 'Never auto-install a package lacking an authenticated publisher manifest.'
