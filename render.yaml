# Bird Theatre prototype: one FREE web service, no new PostgreSQL instance.
# DATABASE_URL is sourced from the EXISTING Electrical Workbench PostgreSQL instance.
# Bird Theatre creates/uses only the "bird_theatre" PostgreSQL schema, never public.
# This is logical schema isolation, NOT separate credentials or resource quotas.
services:
  - type: web
    name: bird-theatre
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SERVER_PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          name: remote-javafx-portal-db
          property: connectionString
      - key: BIRD_DB_SCHEMA
        value: bird_theatre
      # Securely reference the existing Electrical Workbench Mailjet settings.
      # Render resolves these values; credentials never enter GitHub or the agent.
      - key: BIRD_MAILJET_API_KEY
        fromService:
          type: web
          name: remote-javafx-portal
          envVarKey: SPRING_MAIL_USERNAME
      - key: BIRD_MAILJET_SECRET_KEY
        fromService:
          type: web
          name: remote-javafx-portal
          envVarKey: SPRING_MAIL_PASSWORD
      - key: BIRD_MAIL_FROM
        fromService:
          type: web
          name: remote-javafx-portal
          envVarKey: MAIL_FROM
