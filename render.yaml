# Bird Theatre prototype: one FREE web service, no new PostgreSQL instance.
# DATABASE_URL is sourced from the EXISTING Electrical Workbench PostgreSQL instance.
# Bird Theatre creates/uses only the "bird_theatre" PostgreSQL schema, never public.
# This is logical schema isolation, NOT separate credentials or resource quotas.
services:
  - type: web
    name: bird-theatre
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SERVER_PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          name: remote-javafx-portal-db
          property: connectionString
      - key: BIRD_DB_SCHEMA
        value: bird_theatre
