name: BirdTheatre
options:
  bundleIdPrefix: ca.gfh
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  BirdTheatre:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: BirdTheatre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.gfh.birdtheatre
        PRODUCT_NAME: BirdTheatre
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bird Theatre
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
schemes:
  BirdTheatre:
    build:
      targets:
        BirdTheatre: all
    run:
      config: Debug
    archive:
      config: Release
