spring.application.name=Bird Theatre
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:h2:mem:birdtheatre;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,info
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
spring.main.banner-mode=off

# Reuse Electrical Workbench's Mailjet PROVIDER with HTTPS API on Render Free.
bird.mail.mailjet.api-key=${BIRD_MAILJET_API_KEY:}
bird.mail.mailjet.secret-key=${BIRD_MAILJET_SECRET_KEY:}
bird.mail.smtp-enabled=${BIRD_SMTP_ENABLED:false}

# Optional SMTP credentials for local or paid hosting; disabled on Render Free.
spring.mail.host=${BIRD_SMTP_HOST:}
spring.mail.port=${BIRD_SMTP_PORT:587}
spring.mail.username=${BIRD_SMTP_USERNAME:}
spring.mail.password=${BIRD_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
bird.mail.from=${BIRD_MAIL_FROM:}
bird.auth.legacy-signup-enabled=false

# Avoid failing /actuator/health before SMTP is provisioned; registration checks email separately.
management.health.mail.enabled=false

# PostgreSQL schema boundary for the shared-instance prototype (ignored by local H2).
bird.db.schema=${BIRD_DB_SCHEMA:bird_theatre}
